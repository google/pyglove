# This workflow will upload a Python Package using Twine when a release is created.
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: pypi

on:
  release:
    types: [created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v1
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
        pip install -r requirements.txt
    - name: Build distributions
      run: |
        # Remove the parallel image for Github dark mode in README.md
        sed -i -e 's$<img src="https://raw.githubusercontent.com/google/pyglove/main/docs/_static/logo_dark.svg#gh-dark-mode-only" width="320px" alt="logo"></img>$$' README.md
        python setup.py sdist bdist_wheel
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
    - name: Clean up prior staged artifacts in OSS Exit Gate repository
      run: |
        set -euo pipefail
        EXISTING_PKGS="$(gcloud artifacts packages list \
          --project=oss-exit-gate-prod \
          --location=us \
          --repository=pyglove--pypi \
          --format='value(name)' 2>/dev/null || true)"
        for pkg in ${EXISTING_PKGS}; do
          gcloud artifacts packages delete "${pkg}" \
            --project=oss-exit-gate-prod \
            --location=us \
            --repository=pyglove--pypi \
            --quiet || true
        done
    - name: Publish to OSS Exit Gate
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        set +x
        export TWINE_USERNAME="oauth2accesstoken"
        export TWINE_PASSWORD="$(gcloud auth print-access-token)"
        twine upload \
          --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/pyglove--pypi/ \
          --non-interactive \
          --skip-existing \
          dist/*
        unset TWINE_PASSWORD
        printf '{"publish_all": true}\n' > manifest.json
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/pyglove/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
